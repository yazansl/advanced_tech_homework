<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- استخدام نسخة مستقرة ومحدثة من بوتستراب لدعم التنسيق العربي -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <title>الحاسبة الذكية</title>
</head>
<body>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h4 class="text-center mb-4">حاسبة العمليات المتعددة</h4>
        
        <form id="calculatorForm">
            <!-- مدخلات الأرقام الثلاثة -->
            <div class="mb-3">
                <label class="form-label">الرقم الأول</label>
                <input type="number" class="form-control" id="valFirst">
            </div>

            <div class="mb-3">
                <label class="form-label">الرقم الثاني</label>
                <input type="number" class="form-control" id="valSecond">
            </div>

            <div class="mb-3">
                <label class="form-label">الرقم الثالث</label>
                <input type="number" class="form-control" id="valThird">
            </div>

            <hr class="my-4">
            <h5 class="mb-3">اختر العمليات المطلوبة:</h5>

            <!-- خيارات العمليات الحسابية مجتمعة -->
            <div class="row mb-4">
                <div class="col-6 mb-2">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="chkSum">
                        <label class="form-check-label">المجموع</label>
                    </div>
                </div>
                <div class="col-6 mb-2">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="chkProd">
                        <label class="form-check-label">حاصل الضرب</label>
                    </div>
                </div>
                <div class="col-6 mb-2">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="chkMaximum">
                        <label class="form-check-label">القيمة الكبرى</label>
                    </div>
                </div>
                <div class="col-6 mb-2">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="chkAverage">
                        <label class="form-check-label">المعدل الحسابي</label>
                    </div>
                </div>
            </div>

            <!-- زر التنفيذ -->
            <button type="button" class="btn btn-success w-100 py-2 mb-4" onclick="processData()">
                إجراء العمليات الحسابية
            </button>

            <!-- صندوق عرض النتائج الموحد -->
            <div id="outputDisplay" class="p-3 bg-light rounded d-none">
                <!-- النتائج ستظهر هنا ديناميكياً -->
            </div>
        </form>
    </div>
</div>

<script>
function processData() {
    // جلب القيم وتحويلها إلى أرقام
    var firstNum = Number(document.getElementById("valFirst").value);
    var secondNum = Number(document.getElementById("valSecond").value);
    var thirdNum = Number(document.getElementById("valThird").value);

    // مصفوفة لتجميع نصوص النتائج
    var outputLog = [];

    // التحقق من العمليات المختارة وبنائها بأسلوب مختلف
    if (document.getElementById("chkSum").checked) {
        var sumResult = firstNum + secondNum + thirdNum;
        outputLog.push("<li><strong>المجموع:</strong> " + sumResult + "</li>");
    }

    if (document.getElementById("chkProd").checked) {
        var prodResult = firstNum * secondNum * thirdNum;
        outputLog.push("<li><strong>حاصل الضرب:</strong> " + prodResult + "</li>");
    }

    if (document.getElementById("chkMaximum").checked) {
        var maxResult = Math.max(firstNum, secondNum, thirdNum);
        outputLog.push("<li><strong>القيمة الكبرى:</strong> " + maxResult + "</li>");
    }

    if (document.getElementById("chkAverage").checked) {
        var avgResult = (firstNum + secondNum + thirdNum) / 3;
        outputLog.push("<li><strong>المعدل الحسابي:</strong> " + avgResult.toFixed(2) + "</li>");
    }

    // عرض النتائج في الصندوق الموحد
    var container = document.getElementById("outputDisplay");
    if (outputLog.length > 0) {
        container.innerHTML = "<h6 class='border-bottom pb-2 mb-2'>النتائج المحسوبة:</h6><ul class='mb-0 pr-3'>" + outputLog.join("") + "</ul>";
        container.classList.remove("d-none");
    } else {
        container.innerHTML = "<p class='text-danger mb-0'>يرجى اختيار عملية حسابية واحدة على الأقل.</p>";
        container.classList.remove("d-none");
    }
}
</script>

</body>
</html>
